<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ панель</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0f0f23; color: white; padding: 16px; }
        h1 { font-size: 20px; text-align: center; margin-bottom: 16px; }
        .card { background: #16213e; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .card h2 { font-size: 14px; color: #e94560; margin-bottom: 8px; }
        .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
        .btn { background: #e94560; border: none; color: white; padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 10px; width: 100%; }
        .btn:hover { opacity: 0.8; }
        input, select { background: #1a1a2e; border: 1px solid #333; color: white; padding: 8px; border-radius: 6px; width: 100%; font-size: 14px; margin-bottom: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h1>🔧 Админ панель</h1>
    <div class="card" id="stats">
        <h2>Статистика</h2>
        <div class="row"><span>Всего открытий:</span><span id="totalOpens">0</span></div>
        <div class="row"><span>Уникальных пользователей:</span><span id="uniqueUsers">0</span></div>
    </div>
    <div class="card">
        <h2>Призы</h2>
        <div id="prizesList"></div>
    </div>
    <div class="card">
        <h2>Последние открытия</h2>
        <div id="recentOpens">Нет данных</div>
    </div>
    <div class="card">
        <h2>Управление</h2>
        <button class="btn" onclick="resetAll()">🔄 Сбросить всё</button>
        <button class="btn" onclick="exportData()">📥 Экспорт CSV</button>
    </div>

    <script>
        const BOT_TOKEN = 'ТВОЙ_ТОКЕН';
        const ADMIN_ID = 'ТВОЙ_ADMIN_ID';

        async function getData() {
            // Получаем все localStorage всех пользователей через бота нельзя,
            // поэтому используем простой сбор статистики через API бота
            try {
                const resp = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=-1`);
                const data = await resp.json();
                // Здесь логика парсинга уведомлений
                // Для простоты — показываем заглушку
                document.getElementById('totalOpens').textContent = 'требуется сервер';
                document.getElementById('uniqueUsers').textContent = 'требуется сервер';
            } catch(e) {
                document.getElementById('stats').innerHTML = '<h2>Статистика</h2><p style="color:#e94560">Для полной статистики нужен сервер</p>';
            }
        }

        function resetAll() {
            if (confirm('Сбросить все сундуки для всех пользователей?')) {
                localStorage.clear();
                alert('Готово! Только локально. Для глобального сброса нужен сервер.');
                location.reload();
            }
        }

        function exportData() {
            const data = [];
            for (let key in localStorage) {
                if (key.startsWith('chests_')) {
                    data.push({ userId: key.replace('chests_', ''), state: JSON.parse(localStorage.getItem(key)) });
                }
            }
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'chests_data.json';
            a.click();
        }

        getData();
    </script>
</body>
</html>
